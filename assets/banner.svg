<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #fbbf24; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #cbd5e1; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.6; }
      100% { opacity: 0.3; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    
    .glow-circle { animation: pulseGlow 4s ease-in-out infinite; }
    .floating { animation: floatParticle 4s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Background Dynamic Glowing Accents -->
  <g class="glow-circle" opacity="0.4">
    <circle cx="1020" cy="150" r="140" fill="#f59e0b" />
    <circle cx="150" cy="80" r="100" fill="#3b82f6" />
  </g>

  <!-- Construction Motif Waves -->
  <g opacity="0.12">
    <path d="M -100 250 L 300 50 L 400 50 L 0 250 Z" fill="#f59e0b" />
    <path d="M 100 250 L 500 50 L 600 50 L 200 250 Z" fill="#ffffff" />
    <path d="M 300 250 L 700 50 L 800 50 L 400 250 Z" fill="#f59e0b" />
    <path d="M 500 250 L 900 50 L 1000 50 L 600 250 Z" fill="#ffffff" />
  </g>

  <!-- Side Floating Cards (Background Layer) -->
  <g class="floating" opacity="0.85">
    <rect x="930" y="45" width="220" height="65" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="950" y="72" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="13">Hardhat Alert</text>
    <text x="950" y="92" fill="#94a3b8" font-family="sans-serif" font-size="11">AI Detection Active</text>

    <rect x="870" y="165" width="240" height="65" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="890" y="192" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="13">TRIR Safety Index</text>
    <text x="890" y="212" fill="#94a3b8" font-family="sans-serif" font-size="11">Zero Incidents - 90 Days</text>
  </g>

  <!-- Safety Stripe Accent Bar -->
  <rect x="60" y="50" width="8" height="200" rx="4" fill="url(#accentGrad)" />

  <!-- Hardhat Vector Graphics -->
  <g transform="translate(90, 55)">
    <path d="M 20 40 C 20 15 45 5 70 5 C 95 5 120 15 120 40 L 130 43 C 133 44 135 47 135 50 C 135 53 133 55 130 55 L 10 55 C 7 55 5 53 5 50 C 5 47 7 44 10 43 Z" fill="#f59e0b" />
    <rect x="60" y="2" width="20" height="25" rx="3" fill="#d97706" />
  </g>

  <!-- Main Title & Subtitle Foreground -->
  <text x="240" y="110" class="title">Awesome Construction Safety</text>
  <text x="240" y="152" class="subtitle">Curated SaaS Platforms, EHS Software &amp; Open-Source Tools</text>

  <!-- Pill Badges -->
  <g transform="translate(240, 185)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="18" y="21" class="badge-text">Site Safety</text>

    <rect x="142" y="0" width="155" height="32" rx="16" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="160" y="21" class="badge-text">Hazard Tracking</text>

    <rect x="309" y="0" width="145" height="32" rx="16" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="327" y="21" class="badge-text">OSHA &amp; CAPA</text>

    <rect x="466" y="0" width="160" height="32" rx="16" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="484" y="21" class="badge-text">Open Source EHS</text>
  </g>
</svg>
